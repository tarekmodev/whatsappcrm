# Render Blueprint — the whole hosted platform, defined in the repository.
#
# Three environments, each with its own database, its own Key Value instance and
# its own credentials. Nothing is shared between them: a development WhatsApp
# token cannot reach the production database, because they are different rows in
# different secret groups pointing at different services.
#
# Syncing this blueprint creates or updates every resource below. Render prompts
# once per `sync: false` variable, per environment, and those values live only in
# Render — never in this file, never in a layer, never in a log.
#
# Deployment target and its rationale: docs/adr/0001-stack-decision.md (decision 9).
# Provisioning walkthrough and the uptime alerting it cannot express:
# docs/runbooks/environments.md.
#
# ---------------------------------------------------------------------------
# One thing this blueprint deliberately does NOT declare: custom domains.
# ---------------------------------------------------------------------------
#
# The spec has a `domains:` list on a web service, and both the wildcard
# `*.<PLATFORM_DOMAIN>` and every tenant's own hostname would go in it. Neither
# is here, for one reason each.
#
# Tenant hostnames are runtime state. They are created by customers through
# `POST /api/v1/tenant/domains`, arrive between commits, and there may eventually
# be hundreds. A set that grows without anyone opening an editor does not belong
# in a file whose whole value is being the source of truth.
#
# The wildcard could be declared and is not, because `domains:` is a *list* and
# Render's documented sync rule is that Dashboard configuration conflicting with
# the Blueprint is overwritten. Whether a partial list prunes the domains added
# out of band is not stated anywhere we could find, and it was not testable from
# the task that wrote this. If it does prune, the first unrelated blueprint sync
# after the first custom domain goes live drops every white-label customer's TLS
# at once, with no failed deploy to point at. So custom domains are attached out
# of band on purpose, and this file says nothing about them — an omitted setting
# is documented as left alone, which is the property being relied on here.
#
# The operator procedure, the DNS records, and the experiment that would settle
# this and let the wildcard move in here: docs/runbooks/custom-domains.md.

previews:
  # A preview environment would need its own database and its own WhatsApp
  # credentials to be worth anything, and would otherwise quietly point at a real
  # one. Turned on deliberately or not at all.
  generation: 'off'

projects:
  - name: whatsappcrm
    environments:
      # -----------------------------------------------------------------------
      # Development — the integration environment. Deploys on every commit to
      # `main`, so a merge is visible somewhere real within minutes.
      # -----------------------------------------------------------------------
      - name: development
        services:
          - type: web
            name: whatsappcrm-api-dev
            runtime: node
            plan: starter
            region: frankfurt
            branch: main
            rootDir: .
            autoDeployTrigger: commit
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@whatsappcrm/api...
            # Schema changes land before the code that depends on them, from the
            # same build that produced that code. A failed pre-deploy aborts the
            # deploy, so a broken migration never reaches a running instance.
            preDeployCommand: pnpm db:migrate:deploy && pnpm --filter @whatsappcrm/api db:provision-roles
            # "exec node", never "pnpm start" — this applies to every service below.
            # Verified: with pnpm in between, SIGTERM kills the process without Nest's
            # shutdown hooks ever running, so in-flight requests are cut, pools are left
            # dangling and buffered error-tracker events are lost on every deploy.
            # "exec" makes node PID 1, so the signal reaches its handler. Do not "tidy"
            # this back into a pnpm script.
            #
            # RENDER_GIT_COMMIT is injected by the platform; passing it through as
            # APP_VERSION keeps the application itself free of vendor variables.
            startCommand: exec env APP_VERSION=$RENDER_GIT_COMMIT node apps/api/dist/main.js
            healthCheckPath: /api/health/ready
            envVars:
              - key: NODE_ENV
                value: production
              - key: DEPLOY_ENV
                value: development
              - key: LOG_LEVEL
                value: debug
              - key: DATABASE_URL
                fromDatabase:
                  name: whatsappcrm-db-dev
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: whatsappcrm-kv-dev
                  property: connectionString
              # The two roles the running API connects as (TAR-48/TAR-49). Not
              # `fromDatabase`: that property yields the migration *owner*, which on
              # a managed instance is a superuser and so skips row-level security
              # entirely — every tenant would see every row. These are built from
              # the same host as DATABASE_URL but with the app role's own
              # credentials, which the pre-deploy hook sets from the passwords below.
              - key: APP_DATABASE_URL
                sync: false
              - key: SYSTEM_DATABASE_URL
                sync: false
              # Needs a scheme, which `fromService` cannot supply, and becomes a
              # custom domain once white-labelling lands.
              - key: WEB_ORIGIN
                sync: false
              # The CNAME target this environment hands a tenant that is pointing
              # its own hostname at us (TAR-419): the *public* edge host of the web
              # service below, bare, with no scheme and no trailing dot, because it
              # goes into a DNS record and not into a URL.
              #
              # Prompted rather than `fromService`, and the temptation is real:
              # `fromService.property: host` yields the *private network* hostname
              # (`whatsappcrm-web-dev`), which no customer's resolver can ever see.
              # A tenant handed that value gets a CNAME that dead-ends, and the
              # failure is a domain that never verifies rather than a failed deploy.
              #
              # Predicted value below; confirm it against the hostname Render
              # actually assigned, which carries a suffix when the service name was
              # already taken globally — docs/runbooks/custom-domains.md.
              #
              #   whatsappcrm-web-dev.onrender.com
              #
              # Not a secret: it is published to every tenant that adds a domain.
              - key: PLATFORM_EDGE_HOSTNAME
                sync: false
              # Public origin of the Socket.IO server, handed to the browser on
              # `POST /api/v1/auth/realtime-ticket` (TAR-180). The gateway runs in
              # this service, so it is this service's own public URL — declared
              # explicitly because the schema default is `http://localhost:3001`,
              # which in a deployed environment would aim every browser at itself.
              # Not a secret: it reaches every client.
              - key: REALTIME_URL
                sync: false
              # The other half of the pair the web service holds (TAR-64). The two
              # are declared together, and must be given the same value, because
              # they only mean anything together: the web tier signs a forwarded
              # tenant host with this, and `HostTenantGuard` honours the host only
              # when it matches. Declared here before TAR-148 reads it, so landing
              # the guard cannot deploy a web tier signing with a secret this
              # service has no variable to hold — which would fall back to `Host`
              # and answer `tenant_not_found` on every tenant route, everywhere.
              # Generate per environment with `openssl rand -hex 32`.
              #
              # TRUSTED_PROXY_SECRET_PREVIOUS is accepted as well as the current
              # value, so the secret can be rotated without a synchronised
              # two-service deploy. Leave it empty except during a rotation: put
              # the old value in it and the new one above, redeploy the API so it
              # accepts both, move the web service onto the new value, then clear
              # it. The API's boot line reports how many secrets it accepts, so a
              # rotation that stopped at step two is visible (TAR-148).
              #
              # Only the API takes it — the web service ever presents one value.
              - key: TRUSTED_PROXY_SECRET
                sync: false
              - key: TRUSTED_PROXY_SECRET_PREVIOUS
                sync: false
              - fromGroup: whatsappcrm-secrets-dev

          - type: web
            name: whatsappcrm-web-dev
            runtime: node
            plan: starter
            region: frankfurt
            branch: main
            rootDir: .
            autoDeployTrigger: commit
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@whatsappcrm/web...
            # Next's real entrypoint, not node_modules/.bin/next — that is a shell
            # wrapper and node cannot execute it. "exec" for the same reason as the API.
            startCommand: cd apps/web && exec node node_modules/next/dist/bin/next start
            envVars:
              - key: NODE_ENV
                value: production
              # NEXT_PUBLIC_* is inlined into the browser bundle. Never a secret.
              - key: NEXT_PUBLIC_API_BASE_URL
                sync: false
              # The API origin, used by server rendering and as the destination of
              # the /api/* rewrite. Needed at BUILD time as well as at runtime:
              # next.config.mjs reads it while building and freezes the rewrite
              # destination into .next/routes-manifest.json. Without it, both the
              # browser proxy and every server-side call go to localhost:3001 and
              # the console cannot reach the API at all. Needs a scheme, which
              # `fromService` cannot supply. Server-only — no NEXT_PUBLIC_ prefix.
              - key: API_BASE_URL
                sync: false
              # Proves to the API that a forwarded tenant host came from this tier
              # and not from an arbitrary caller (TAR-64). Must hold the SAME value
              # as the API service's TRUSTED_PROXY_SECRET in this environment; when
              # they disagree the API resolves no tenant and every tenant route
              # answers tenant_not_found. Generate per environment with
              # `openssl rand -hex 32`.
              #
              # Server-only, and it must stay that way: a NEXT_PUBLIC_ prefix would
              # inline it into the browser bundle and hand it to every visitor.
              # Read at runtime, not baked into the build, so rotating it is a
              # restart rather than a rebuild.
              - key: TRUSTED_PROXY_SECRET
                sync: false

          - type: keyvalue
            name: whatsappcrm-kv-dev
            plan: starter
            region: frankfurt
            # Empty allow-list: reachable only over Render's private network.
            ipAllowList: []
            # The queue holds work, not cache. Evicting a job under memory pressure
            # loses it silently.
            maxmemoryPolicy: noeviction

        databases:
          - name: whatsappcrm-db-dev
            databaseName: whatsappcrm
            user: whatsappcrm
            # Paid, deliberately: free Postgres has no backups and no
            # point-in-time recovery, which TAR-43 depends on.
            plan: basic-256mb
            region: frankfurt
            postgresMajorVersion: '16'
            ipAllowList: []

        envVarGroups:
          - name: whatsappcrm-secrets-dev
            envVars:
              # Read by the pre-deploy hook, which creates the two application
              # roles and sets these as their passwords. Generate one per role per
              # environment (`openssl rand -hex 32`) and use the same value inside
              # the matching *_DATABASE_URL above — they must agree, and nothing
              # checks that for you until the API fails to authenticate.
              #
              # Not `generateValue: true`, tempting as it is: a generated value is
              # never shown in a form the operator can copy into the URL.
              - key: APP_DATABASE_PASSWORD
                sync: false
              - key: SYSTEM_DATABASE_PASSWORD
                sync: false
              - key: SENTRY_DSN
                sync: false
              # Owned by TAR-35 and TAR-37; declared here so each environment gets
              # its own provider credentials from day one rather than sharing one
              # set and discovering the coupling in production. Use the provider's
              # *test* credentials in development and staging.
              - key: WHATSAPP_APP_SECRET
                sync: false
              - key: WHATSAPP_ACCESS_TOKEN
                sync: false
              - key: WHATSAPP_PHONE_NUMBER_ID
                sync: false
              - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
                sync: false
              - key: POLAR_ACCESS_TOKEN
                sync: false
              - key: POLAR_WEBHOOK_SECRET
                sync: false

      # -----------------------------------------------------------------------
      # Staging — the rehearsal. Same code path, same schema version, real
      # provider sandbox credentials. Deploys only once CI is green.
      # -----------------------------------------------------------------------
      - name: staging
        services:
          - type: web
            name: whatsappcrm-api-staging
            runtime: node
            plan: starter
            region: frankfurt
            branch: main
            rootDir: .
            autoDeployTrigger: checksPass
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@whatsappcrm/api...
            preDeployCommand: pnpm db:migrate:deploy && pnpm --filter @whatsappcrm/api db:provision-roles
            startCommand: exec env APP_VERSION=$RENDER_GIT_COMMIT node apps/api/dist/main.js
            healthCheckPath: /api/health/ready
            envVars:
              - key: NODE_ENV
                value: production
              - key: DEPLOY_ENV
                value: staging
              - key: LOG_LEVEL
                value: info
              - key: DATABASE_URL
                fromDatabase:
                  name: whatsappcrm-db-staging
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: whatsappcrm-kv-staging
                  property: connectionString
              # The two roles the running API connects as (TAR-48/TAR-49). Not
              # `fromDatabase`: that property yields the migration *owner*, which on
              # a managed instance is a superuser and so skips row-level security
              # entirely. Built from the same host as DATABASE_URL but with the app
              # role's own credentials, which the pre-deploy hook sets.
              - key: APP_DATABASE_URL
                sync: false
              - key: SYSTEM_DATABASE_URL
                sync: false
              - key: WEB_ORIGIN
                sync: false
              # The public edge host of this environment's web service, handed to
              # tenants as a CNAME target — see the development environment above
              # for why `fromService` cannot supply it. Predicted value:
              #
              #   whatsappcrm-web-staging.onrender.com
              - key: PLATFORM_EDGE_HOSTNAME
                sync: false
              # This service's own public URL — see the development environment
              # above for why the schema default cannot be relied on here.
              - key: REALTIME_URL
                sync: false
              # Same value as this environment's web service — see the development
              # environment above for why the two are declared together, and for
              # how PREVIOUS is used during a rotation.
              - key: TRUSTED_PROXY_SECRET
                sync: false
              - key: TRUSTED_PROXY_SECRET_PREVIOUS
                sync: false
              - fromGroup: whatsappcrm-secrets-staging

          - type: web
            name: whatsappcrm-web-staging
            runtime: node
            plan: starter
            region: frankfurt
            branch: main
            rootDir: .
            autoDeployTrigger: checksPass
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@whatsappcrm/web...
            # Next's real entrypoint, not node_modules/.bin/next — that is a shell
            # wrapper and node cannot execute it. "exec" for the same reason as the API.
            startCommand: cd apps/web && exec node node_modules/next/dist/bin/next start
            envVars:
              - key: NODE_ENV
                value: production
              - key: NEXT_PUBLIC_API_BASE_URL
                sync: false
              # Read at build time as well as at runtime — see the development
              # environment above for why omitting it breaks both API paths.
              - key: API_BASE_URL
                sync: false
              # Same value as this environment's API service. See the development
              # environment above for what happens when the two disagree.
              - key: TRUSTED_PROXY_SECRET
                sync: false

          - type: keyvalue
            name: whatsappcrm-kv-staging
            plan: starter
            region: frankfurt
            ipAllowList: []
            maxmemoryPolicy: noeviction

        databases:
          - name: whatsappcrm-db-staging
            databaseName: whatsappcrm
            user: whatsappcrm
            plan: basic-256mb
            region: frankfurt
            postgresMajorVersion: '16'
            ipAllowList: []

        envVarGroups:
          - name: whatsappcrm-secrets-staging
            envVars:
              # Read by the pre-deploy hook, which creates the two application
              # roles and sets these as their passwords. Generate one per role per
              # environment (`openssl rand -hex 32`) and use the same value inside
              # the matching *_DATABASE_URL above — they must agree, and nothing
              # checks that for you until the API fails to authenticate.
              #
              # Not `generateValue: true`, tempting as it is: a generated value is
              # never shown in a form the operator can copy into the URL.
              - key: APP_DATABASE_PASSWORD
                sync: false
              - key: SYSTEM_DATABASE_PASSWORD
                sync: false
              - key: SENTRY_DSN
                sync: false
              - key: WHATSAPP_APP_SECRET
                sync: false
              - key: WHATSAPP_ACCESS_TOKEN
                sync: false
              - key: WHATSAPP_PHONE_NUMBER_ID
                sync: false
              - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
                sync: false
              - key: POLAR_ACCESS_TOKEN
                sync: false
              - key: POLAR_WEBHOOK_SECRET
                sync: false

      # -----------------------------------------------------------------------
      # Production — holds real tenant data. Never deploys itself: the commit that
      # came through staging is promoted here deliberately.
      # -----------------------------------------------------------------------
      - name: production
        services:
          - type: web
            name: whatsappcrm-api-prod
            runtime: node
            plan: standard
            region: frankfurt
            branch: main
            autoDeployTrigger: 'off'
            rootDir: .
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@whatsappcrm/api...
            preDeployCommand: pnpm db:migrate:deploy && pnpm --filter @whatsappcrm/api db:provision-roles
            startCommand: exec env APP_VERSION=$RENDER_GIT_COMMIT node apps/api/dist/main.js
            healthCheckPath: /api/health/ready
            envVars:
              - key: NODE_ENV
                value: production
              - key: DEPLOY_ENV
                value: production
              - key: LOG_LEVEL
                value: info
              - key: DATABASE_URL
                fromDatabase:
                  name: whatsappcrm-db-prod
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: whatsappcrm-kv-prod
                  property: connectionString
              # The two roles the running API connects as (TAR-48/TAR-49). Not
              # `fromDatabase`: that property yields the migration *owner*, which on
              # a managed instance is a superuser and so skips row-level security
              # entirely. Built from the same host as DATABASE_URL but with the app
              # role's own credentials, which the pre-deploy hook sets.
              - key: APP_DATABASE_URL
                sync: false
              - key: SYSTEM_DATABASE_URL
                sync: false
              - key: WEB_ORIGIN
                sync: false
              # The public edge host of this environment's web service, handed to
              # tenants as a CNAME target — see the development environment above
              # for why `fromService` cannot supply it. Predicted value:
              #
              #   whatsappcrm-web-prod.onrender.com
              #
              # Changing this in production invalidates the CNAME every tenant with
              # a custom domain has already published. Treat it as fixed once the
              # first custom domain is live.
              - key: PLATFORM_EDGE_HOSTNAME
                sync: false
              # This service's own public URL — see the development environment
              # above for why the schema default cannot be relied on here.
              - key: REALTIME_URL
                sync: false
              # Same value as this environment's web service — see the development
              # environment above for why the two are declared together, and for
              # how PREVIOUS is used during a rotation.
              - key: TRUSTED_PROXY_SECRET
                sync: false
              - key: TRUSTED_PROXY_SECRET_PREVIOUS
                sync: false
              - fromGroup: whatsappcrm-secrets-prod

          - type: web
            name: whatsappcrm-web-prod
            runtime: node
            plan: standard
            region: frankfurt
            branch: main
            autoDeployTrigger: 'off'
            rootDir: .
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@whatsappcrm/web...
            # Next's real entrypoint, not node_modules/.bin/next — that is a shell
            # wrapper and node cannot execute it. "exec" for the same reason as the API.
            startCommand: cd apps/web && exec node node_modules/next/dist/bin/next start
            envVars:
              - key: NODE_ENV
                value: production
              - key: NEXT_PUBLIC_API_BASE_URL
                sync: false
              # Read at build time as well as at runtime — see the development
              # environment above for why omitting it breaks both API paths.
              - key: API_BASE_URL
                sync: false
              # Same value as this environment's API service. See the development
              # environment above for what happens when the two disagree.
              - key: TRUSTED_PROXY_SECRET
                sync: false

          - type: keyvalue
            name: whatsappcrm-kv-prod
            plan: standard
            region: frankfurt
            ipAllowList: []
            maxmemoryPolicy: noeviction

        databases:
          - name: whatsappcrm-db-prod
            databaseName: whatsappcrm
            user: whatsappcrm
            plan: basic-1gb
            region: frankfurt
            postgresMajorVersion: '16'
            ipAllowList: []

        envVarGroups:
          - name: whatsappcrm-secrets-prod
            envVars:
              # Read by the pre-deploy hook, which creates the two application
              # roles and sets these as their passwords. Generate one per role per
              # environment (`openssl rand -hex 32`) and use the same value inside
              # the matching *_DATABASE_URL above — they must agree, and nothing
              # checks that for you until the API fails to authenticate.
              #
              # Not `generateValue: true`, tempting as it is: a generated value is
              # never shown in a form the operator can copy into the URL.
              - key: APP_DATABASE_PASSWORD
                sync: false
              - key: SYSTEM_DATABASE_PASSWORD
                sync: false
              - key: SENTRY_DSN
                sync: false
              # Production takes the provider's *live* credentials, entered
              # deliberately. Never copied down from another environment.
              - key: WHATSAPP_APP_SECRET
                sync: false
              - key: WHATSAPP_ACCESS_TOKEN
                sync: false
              - key: WHATSAPP_PHONE_NUMBER_ID
                sync: false
              - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
                sync: false
              - key: POLAR_ACCESS_TOKEN
                sync: false
              - key: POLAR_WEBHOOK_SECRET
                sync: false
