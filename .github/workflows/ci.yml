name: CI

# Gates everything that can reach `main`: pushes to the branch itself, and every
# pull request targeting it. `main` is branch-protected on all four job names
# below — renaming a job here means updating that protection rule too.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: nothing in this workflow writes back to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs are worthless; superseded `main` runs are the
  # record of what was merged, so those are left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # Keep Turborepo's cache where the caching step in the setup action expects it.
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      # Prettier first: it takes seconds, and it is the failure a contributor can
      # clear with a single `pnpm format`.
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint

      # Prisma does not generate down migrations, so reversibility is a convention
      # (docs/runbooks/migrations.md). A convention nothing checks is a convention
      # that lasts until the first busy afternoon.
      - name: Every migration has a down.sql
        run: pnpm --filter @whatsappcrm/api db:check-migrations

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - name: tsc --noEmit across every workspace
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - name: Jest (api) and Vitest (web, contracts)
        run: pnpm test

  # Tenant isolation is a database property, so it cannot be asserted by a unit
  # test — this job builds a real database from the migrations and proves two
  # tenants cannot see each other's rows (TAR-39, decision 1, rule 4), first in
  # SQL and then through the Prisma clients the application actually uses. It
  # runs the same commands a developer runs locally, against the same Compose
  # stack, so a green run here means the README's instructions work too.
  #
  # Required to pass before merge, alongside `Lint`/`Type-check`/`Test` (TAR-96)
  # — an isolation regression that only this job catches must not be mergeable.
  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
      - name: Start PostgreSQL and Redis
        run: pnpm db:up
      - name: Apply migrations
        run: pnpm db:migrate:deploy
      - name: Create application roles
        run: pnpm db:roles
      # The roles are created NOLOGIN; this is the operator step that gives them
      # the throwaway password `.env.example` ships, so the API's two clients can
      # actually connect. A real environment passes a value from its secret store.
      - name: Enable login for the application roles
        run: pnpm db:roles:login
      - name: Verify tenant isolation
        run: pnpm db:verify:rls
      # Proves the same guarantee through the client the application uses, as
      # `whatsappcrm_app`: fail-closed with no tenant, and one tenant's rows only
      # with one (TAR-49).
      - name: Tenant isolation through TenantPrisma
        run: pnpm test:db
      # TAR-46's acceptance criterion is that a clean clone reaches a running app
      # against a *seeded* database, which is a claim about the README rather than
      # about any one function — so it is checked the same way the rest of this
      # job is, by running the command the README tells a developer to run. Last,
      # because the two checks above assert row counts of their own and a
      # populated database is not what they were written against.
      - name: Seed the demo dataset
        run: pnpm db:seed
      - name: Stop containers
        if: always()
        run: pnpm db:down
