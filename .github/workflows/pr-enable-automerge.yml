name: Enable auto-merge on agent pull requests

# `pr-autoupdate.yml` only refreshes branches that have already asked for
# auto-merge — that opt-in is what tells it a branch is ready to be kept fresh.
# The README asks every agent to run `gh pr merge --auto --squash` itself, and
# that instruction did not hold: when TAR-446 was investigated, all 12 open pull
# requests had `autoMerge=false`, so the sweep skipped every one of them and the
# rebase-thrash loop carried on exactly as before.
#
# Relying on each of a dozen agents to remember one command is the weak link.
# This closes it: an agent pull request opts itself in the moment it is ready.
#
# Auto-merge does not weaken any gate. The four required checks and the
# up-to-date requirement still have to pass — this only decides *when* the pull
# request may land once they do, instead of leaving it parked.

on:
  pull_request:
    # `synchronize` is here for one specific failure, found on #198 (TAR-516).
    #
    # GitHub does not start `pull_request` workflows for a pull request it
    # cannot build a merge ref for, and it cannot build one while the branch
    # conflicts with the base. So a pull request that opens CONFLICTING never
    # gets an `opened` run — this workflow included — and the arm is simply
    # lost. Resolving the conflict is a force-push, and a force-push delivers
    # only `synchronize`. With `synchronize` absent from this list, the two
    # events composed into a dead end: a conflicting agent pull request could
    # never re-arm itself by being fixed, which is precisely the case the
    # workflow exists to serve. #198 sat MERGEABLE, CLEAN and fully green with
    # `autoMergeRequest: null` and no way back into the pipeline.
    #
    # The obvious objection to `synchronize` is that it re-arms a pull request
    # whose author deliberately turned auto-merge OFF, on their very next push.
    # That objection is right, and the step below answers it rather than
    # accepting it: on `synchronize` it arms only a pull request that has never
    # been armed at all. See the comment on that check.
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  enable:
    name: Enable
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Same-repository branches only. A fork pull request has no access to the
    # secret below anyway, and arming auto-merge on untrusted code would be the
    # wrong thing to automate even if it did.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'agent/')

    steps:
      - name: Ask GitHub to merge this pull request once it is green
        shell: bash
        env:
          # Deliberately NOT `github.token`, for the same reason
          # `pr-autoupdate.yml` avoids it. Auto-merge lands the pull request as
          # whoever enabled it, and GitHub does not start workflows for pushes
          # made with `GITHUB_TOKEN` — so a merge armed by the built-in token
          # would push to `main` without triggering the sweep that refreshes
          # everything queued behind it, quietly reinstating the very loop this
          # exists to end.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          set -uo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::AUTOMERGE_TOKEN is not set — #$PR was not opted into auto-merge."
            echo "\`AUTOMERGE_TOKEN\` is not set, so #$PR was not opted in." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A push is not consent. `opened` / `reopened` / `ready_for_review` are
          # all moments where arming is the author's evident intent; a push in
          # the middle of a pull request's life is not, so `synchronize` is
          # treated purely as a recovery path for the lost `opened` arm above.
          #
          # The distinguishing fact is in the timeline: if this pull request has
          # EVER been armed, then it is unarmed now because somebody turned it
          # off on purpose, and that decision is theirs to keep. Only a pull
          # request that has never been armed at all is the case where the
          # `opened` delivery went missing.
          #
          # GitHub names the timeline event after the merge method, so all three
          # spellings have to be matched, not just `auto_merge_enabled`.
          if [ "${ACTION:-}" = "synchronize" ]; then
            if ! events=$(gh api "repos/$REPO/issues/$PR/timeline?per_page=100" \
                            --paginate --jq '.[].event' 2>&1); then
              echo "::warning::could not read the timeline for #$PR, so it was not armed on this push: $events"
              exit 0
            fi

            if grep -qE '^auto_(merge|squash|rebase)_enabled$' <<<"$events"; then
              echo "#$PR has been armed before — leaving its current setting alone."
              exit 0
            fi

            echo "#$PR has never been armed; recovering the arm its \`opened\` event never got."
          fi

          if out=$(gh pr merge "$PR" --repo "$REPO" --auto --squash 2>&1); then
            echo "auto-merge enabled on #$PR"
            echo "Auto-merge (squash) is enabled on #$PR — it lands when the required checks are green and the branch is up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The one expected failure: GitHub refuses `--auto` on a pull request
          # that is already fully mergeable, because there is nothing left to
          # wait for. Not an error — it just means the branch is ready now, and
          # its own required checks still gate the merge.
          if grep -qi 'clean status' <<<"$out"; then
            echo "#$PR is already mergeable; auto-merge not needed."
            echo "#$PR is already mergeable — auto-merge was unnecessary." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Anything else is worth seeing, but not worth reddening a pull request
          # whose code may be perfectly fine. The sweep reports the branch as not
          # waiting to auto-merge, which is the visible symptom.
          echo "::warning::could not enable auto-merge on #$PR: $out"
          echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
          echo "> Could not enable auto-merge on #$PR. Enable it by hand with \`gh pr merge $PR --auto --squash\`." >> "$GITHUB_STEP_SUMMARY"
